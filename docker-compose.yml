services:
  postgres:
    image: postgres:16

    container_name: nesa_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChangeMe123!
      POSTGRES_DB: nesa_data

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: